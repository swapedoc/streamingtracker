name: Update Streaming Data
on:
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours — Watch Now + Discover
    - cron: '0 2 * * 0'     # Every Sunday 2am — full catalog refresh + trailer enrich
    - cron: '30 3 * * *'    # Every day 9am IST — watchlist alerts
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - discover-only
          - catalog-only
          - hindi-only
          - alerts-only
          - trailers-only
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      # ── Sunday only: full catalog refresh ──────────────────────────────
      - name: Run full catalog refresh (Sundays only)
        if: github.event.schedule == '0 2 * * 0' || inputs.mode == 'catalog-only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 fetch_full_catalog.py
      # ── Sunday only: enrich trailers + runtime for discover_content ────
      # Runs AFTER catalog refresh so new rows are already in the DB.
      # Isolated from main tracker to protect the YouTube daily quota.
      - name: Enrich trailers + runtime (Sundays + catalog-only)
        # FIX YML1: added catalog-only — without it, a manual catalog-only trigger
        # left new rows with no trailer_id or runtime until the next Sunday (up to 7 days).
        if: >
          github.event.schedule == '0 2 * * 0' ||
          inputs.mode == 'trailers-only' ||
          inputs.mode == 'catalog-only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 enrich_trailers_cron.py
      # ── Every 12 hours: Watch Now + Discover tracker ─────────────────────
      - name: Run tracker
        if: >
          inputs.mode != 'catalog-only' &&
          inputs.mode != 'hindi-only' &&
          inputs.mode != 'alerts-only' &&
          inputs.mode != 'trailers-only' &&
          github.event.schedule != '0 2 * * 0' &&
          github.event.schedule != '30 3 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          if [[ "${{ inputs.mode }}" == "discover-only" ]]; then
            python3 streaming_tracker.py --discover-only
          else
            python3 streaming_tracker.py
          fi
      # ── Sunday only: fetch Hindi dubs ───────────────────────────────────
      - name: Fetch Hindi dubs
        if: github.event.schedule == '0 2 * * 0' || inputs.mode == 'hindi-only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 fetch_hindi_dubs.py
      # ── Sunday only: populate stream URLs + embeddings for new catalog rows ──
      # Runs streaming_tracker.py --discover-only which executes ONLY:
      #   1. DiscoverFlow.save_discover_content()  — TMDb API, no YouTube
      #   2. JustWatchFetcher.run_discover()        — JustWatch GraphQL, no YouTube
      #   3. embed_new_discover()                   — Gemini embeddings, no YouTube
      # FIX YML2: without this step, new Sunday catalog rows had no stream_url and
      # were invisible in Vibe Search for up to 10h until the next 12h cron fired.
      # NOTE: YOUTUBE_API_KEY is intentionally NOT passed here — --discover-only
      # never calls AsyncWatchNowPipeline so no YouTube quota is consumed. This is
      # the reason streaming_tracker.py is not run normally on Sundays and that
      # constraint is preserved: Watch Now + full scoring still only runs on the
      # 12h cron, never on Sundays.
      - name: Populate stream URLs + embeddings for new catalog rows (Sundays only)
        if: github.event.schedule == '0 2 * * 0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 streaming_tracker.py --discover-only
      # ── Daily 9am IST: watchlist alerts ────────────────────────────────
      - name: Send watchlist alerts
        if: github.event.schedule == '30 3 * * *' || inputs.mode == 'alerts-only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 watchlist_alerts.py
      # ── Update sync timestamp (frontend cache invalidation) ─────────────
      # Skipped for alerts-only runs — watchlist_alerts.py changes no frontend data
      - name: Update sync timestamp
        if: >
          inputs.mode != 'alerts-only' &&
          github.event.schedule != '30 3 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -X PATCH "$SUPABASE_URL/rest/v1/sync_state?id=eq.true" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"last_updated\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}"
