name: Update Streaming Data
on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours — Watch Now + Discover
    - cron: '0 2 * * 0'     # Every Sunday 2am — full catalog refresh
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - discover-only
          - catalog-only
          - hindi-only

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Wake Streamlit app
        run: curl -s https://movietracker-swapriya.streamlit.app/ > /dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full catalog refresh (Sundays only)
        if: github.event.schedule == '0 2 * * 0' || inputs.mode == 'catalog-only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 fetch_full_catalog.py

      - name: Run tracker
        if: inputs.mode != 'catalog-only' && inputs.mode != 'hindi-only' && github.event.schedule != '0 2 * * 0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          if [[ "${{ inputs.mode }}" == "discover-only" ]]; then
            python3 streaming_tracker_v3.py --discover-only
          else
            python3 streaming_tracker_v3.py
          fi

      - name: Fetch Hindi dubs
        if: github.event.schedule == '0 2 * * 0' || inputs.mode == 'hindi-only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 fetch_hindi_dubs.py

      - name: Keep Streamlit awake
        run: curl -s https://movietracker-swapriya.streamlit.app/ > /dev/null || true
